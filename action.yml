name: Begin Kosli Trail
description: ''

# Relies on three env-vars set in callers context
# KOSLI_ORG
# KOSLI_FLOW
# KOSLI_TRAIL

inputs:
  cli_version:
    description: "The version of the Kosli CLI to use"
    required: false
    default: latest

  flow_description:
    description: "The description of the Flow in which the Trail is beginning"
    required: true

  template_filename:
    description: "The name of the Kosli template file"
    required: false
    default: ".kosli.yml"

  flow_tags:
    description: "Optional flow tags to apply, one key=value per line (applied with 'kosli tag flow --set')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Kosli CLI
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: kosli-dev/setup-cli-action@v5
      with:
        version: ${{ inputs.cli_version }}

    - name: Create Kosli Flow
      if: ${{ github.ref == 'refs/heads/main' }}
      shell: bash
      run:
        kosli create flow "${KOSLI_FLOW}"
          --description="${{ inputs.flow_description }}"
          --template-file="${{ inputs.template_filename }}"

    - name: Tag Kosli Flow
      if: ${{ github.ref == 'refs/heads/main' && inputs.flow_tags != '' }}
      shell: bash
      env:
        FLOW_TAGS: ${{ inputs.flow_tags }}
      run: |
        # One key=value per line -> a --set flag each. Passed via env (not
        # inline) to avoid injection; blank lines (e.g. a trailing newline)
        # are skipped.
        set_flags=()
        while IFS= read -r tag; do
          [ -n "${tag}" ] && set_flags+=(--set "${tag}")
        done <<< "${FLOW_TAGS}"
        if [ "${#set_flags[@]}" -gt 0 ]; then
          kosli tag flow "${KOSLI_FLOW}" "${set_flags[@]}"
        fi

    - name: Begin Kosli Trail
      if: ${{ github.ref == 'refs/heads/main' }}
      shell: bash
      run:
        kosli begin trail "${KOSLI_TRAIL}"

    - name: Write Trail URL to GitHub Step Summary
      if: ${{ github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        url="https://app.kosli.com/${KOSLI_ORG}/flows/${KOSLI_FLOW}/trails/${KOSLI_TRAIL}"
        echo "[Kosli Trail for ${{ github.event.repository.name }}](${url})" > "${GITHUB_STEP_SUMMARY}"
